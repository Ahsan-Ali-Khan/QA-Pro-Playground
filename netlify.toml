# ─────────────────────────────────────────────────────────────
# Netlify configuration — QA Pro Automation Playground
# ─────────────────────────────────────────────────────────────

[build]
  publish = "."          # serve from repo root (where index.html lives)

# /stable and /stable/ → serve the same index.html (URL stays /stable in the browser)
# window.STABLE_MODE is set by detecting the pathname — no separate HTML file needed
[[redirects]]
  from   = "/stable"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/stable/"
  to     = "/index.html"
  status = 200
