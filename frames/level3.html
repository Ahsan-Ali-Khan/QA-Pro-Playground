<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Level 3 Frame</title>
  <link rel="stylesheet" href="../css/frame-styles.css">
</head>

<body>

  <main class="container">

    <section class="card">

      <header class="card-header">
        <h2>🧩 Level 3 Frame</h2>
        <p class="subtitle">
          Final interaction layer for nested frame automation testing.
        </p>
      </header>

      <form class="form">

        <!-- SEARCH -->
        <div class="form-group">
          <label for="searchInput">Search</label>
          <input
            id="searchInput"
            type="search"
            placeholder="Search something...">
        </div>

        <!-- DATE -->
        <div class="form-group">
          <label for="dateInput">Select Date</label>
          <input id="dateInput" type="date">
        </div>

        <!-- TIME -->
        <div class="form-group">
          <label for="timeInput">Select Time</label>
          <input id="timeInput" type="time">
        </div>

        <!-- COMMENTS -->
        <div class="form-group">
          <label for="commentsInput">Comments</label>
          <textarea
            id="commentsInput"
            placeholder="Enter your comments here...">
          </textarea>
        </div>

        <!-- ACTIONS -->
        <div class="form-actions">

          <button type="submit" class="btn btn-primary">
            ✅ Submit Form
          </button>

          <button type="reset" class="btn btn-secondary">
            Reset
          </button>

        </div>

      </form>

    </section>

  </main>

</body>
</html>
