<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frameset — QA Automation Playground</title>
  <style>
    /* Style the frameset border area */
    body { margin:0; }
  </style>
</head>
<frameset rows="50%,50%" border="3" bordercolor="#d1d5db" framespacing="3">

  <frameset cols="50%,50%" border="3" bordercolor="#d1d5db" framespacing="3">
    <frame name="frameA" src="fset-login.html"     id="frameA" scrolling="auto" marginwidth="0" marginheight="0">
    <frame name="frameB" src="fset-dashboard.html" id="frameB" scrolling="auto" marginwidth="0" marginheight="0">
  </frameset>

  <frameset cols="50%,50%" border="3" bordercolor="#d1d5db" framespacing="3">
    <frame name="frameC" src="fset-table.html"   id="frameC" scrolling="auto" marginwidth="0" marginheight="0">
    <frame name="frameD" src="fset-actions.html" id="frameD" scrolling="auto" marginwidth="0" marginheight="0">
  </frameset>

</frameset>
</html>
