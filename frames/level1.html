<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>QA Automation Frame</title>
  <link rel="stylesheet" href="../css/frame-styles.css">
</head>

<body>

  <main class="container">

    <section class="card">

      <header class="card-header">
        <h2>🧩 Level 1 Frame</h2>
        <p class="subtitle">
          Enter user details and preview nested frame behaviour.
        </p>
      </header>

      <form class="form">

        <!-- NAME -->
        <div class="form-group">
          <label for="nameInput">Name</label>
          <input id="nameInput" type="text" placeholder="Enter your name">
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input id="passwordInput" type="password" placeholder="Enter password">
        </div>

        <!-- CHECKBOX -->
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="toggleAddress">
            Enable Address
          </label>
        </div>

        <!-- ADDRESS (starts removed from DOM) -->
        <div id="addressBox" class="form-group">
          <label for="addressInput">Address</label>
          <textarea id="addressInput" placeholder="Enter address"></textarea>
        </div>

        <!-- ACTIONS -->
        <div class="form-actions">
          <button type="button" class="btn btn-primary">
            Save Details
          </button>

          <button type="reset" class="btn btn-secondary">
            Reset
          </button>
        </div>

      </form>

      <!-- IFRAME AREA -->
      <section class="frame-preview">
        <h3>Frame Preview</h3>

        <iframe
          id="frame-level2"
          src="level2.html">
        </iframe>
      </section>

    </section>

  </main>

  <script>
    // Local dom utilities (iframe has its own window, no access to parent's)
    function domHide(el) {
      if (!el || el._domRemoved) return;
      el._domParent = el.parentNode;
      el._domNext   = el.nextSibling;
      if (el.parentNode) el.parentNode.removeChild(el);
      el._domRemoved = true;
    }
    function domShow(el) {
      if (!el || !el._domRemoved) return;
      if (el._domNext && el._domNext.parentNode === el._domParent)
        el._domParent.insertBefore(el, el._domNext);
      else if (el._domParent)
        el._domParent.appendChild(el);
      el._domRemoved = false;
    }

    const _addressBox = document.getElementById("addressBox");
    domHide(_addressBox); // remove from DOM on load

    document
      .getElementById("toggleAddress")
      .addEventListener("change", function () {
        this.checked ? domShow(_addressBox) : domHide(_addressBox);
      });
  </script>

</body>
</html>
